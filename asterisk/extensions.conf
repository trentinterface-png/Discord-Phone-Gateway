; Discord phone menu — proof-of-deployment config
; Incoming SIP endpoint must be named incoming-gateway.
[from-gateway]
exten => s,1,Goto(phone-menu,s,1)
exten => _X.,1,Goto(phone-menu,s,1)

[phone-menu]
exten => s,1,Answer()
 same => n,Set(TIMEOUT(digit)=5)
 same => n,Set(TIMEOUT(response)=8)
 same => n,Background(custom/choose-channel)
 same => n,WaitExten(8)
 same => n,Hangup()

exten => 1,1,NoOp(Gaming VC / SIPcord 1001)
 same => n,Dial(PJSIP/1001@sipcord,180)
 same => n,Hangup()

exten => 2,1,NoOp(Lobby VC / SIPcord 1002)
 same => n,Dial(PJSIP/1002@sipcord,180)
 same => n,Hangup()

exten => i,1,Playback(pbx-invalid)
 same => n,Goto(s,1)
exten => t,1,Playback(vm-goodbye)
 same => n,Hangup()
exten => h,1,NoOp(Call ended; Asterisk tears down both call legs)
